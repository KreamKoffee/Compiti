<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>Document</title>
        <script>
            function calcola(op){
                var n1=document.getElementById("num1").value;
                var n2=document.getElementById("num2").value*1;
                var s;
                if(isNaN(n1) || isNaN(n2)){
                    alert("Inserire valori numerici");
                    document.getElementById("num1").value="";
                    document.getElementById("num2").value="";
                }
                else{
                    n1=n1*1;
                    n2=n2*1;
                    if(op==0){
                        s=n1+n2;
                        document.getElementById("messaggio").innerHTML="<h1>La somma di "+n1+" e "+n2+" vale "+s+"</h1>";
                    }
                    else{
                        s=n1-n2;
                        document.getElementById("messaggio").innerHTML="<h1>La differenza tra "+n1+" e "+n2+" vale "+s+"</h1>";
                    }
                   
                    document.getElementById("ris").value=s;
                   
                }
               
            }




        </script>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row mb-3">
                <div class="col-md-2">
                    <input type="text" class="form-control" name="num1" id="num1" placeholder="Inserisci il primo numero">
                </div>
                <div class="col-md-2">
                    <input type="text" class="form-control" name="num2" id="num2" placeholder="Inserisci il secondo numero">
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary" onclick="calcola(0);">Somma</button>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary" onclick="calcola(1);">Differenza</button>
                </div>
                <div class="col-md-1">
                    <input type="text" class="form-control" name="ris" id="ris" disabled>
                </div>
            </div>
            <div class="row mb-3" id="messaggio">


            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
