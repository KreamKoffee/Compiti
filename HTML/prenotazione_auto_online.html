<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <div class="container mt-5 border border-primary rounded p-4">
        <h1 class="text-center">Prenotazione Auto Online</h1>
            <div class="row mb-3">
                <div class="col-md-5">
                    <label for="nome" class="form-label">Nome e Cognome</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>
                <div class="col-md-2">
                    <label for="età" class="form-label">Età</label>
                    <input type="number" class="form-control" id="età" name="età" required>
                </div>
                <div class="col-md-5">
                    <label for="Numero patente" class="form-label">Numero Patente</label>
                    <input type="text" class="form-control" id="Numero patente" name="Numero patente" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-7">
                    <label for="cognome" class="form-label">Email</label>
                    <input type="text" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-md-5">
                    <label for="telefono" class="form-label">Telefono</label>
                    <input type="text" class="form-control" id="telefono" name="telefono" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="auto" class="form-label">sleziona un'auto</label>
                    <select class="form-select" id="auto" name="auto" required>
                        <option value="" disabled selected>Seleziona un'auto</option>
                        <option value="auto1">Auto 1</option>
                        <option value="auto2">Auto 2</option>
                        <option value="auto3">Auto 3</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3"> 
                <div class="col-md-4">
                    <label for="data" class="form-label">Data di ritiro</label>
                    <input type="date" class="form-control" id="data" name="data" required>
                </div>
                <div class="col-md-4">
                    <label for="data" class="form-label">Data e ora di riconsegna</label>
                    <input type="datetime-local" class="form-control" id="riconsegna" name="riconsegna" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-mb-3">
                    <label for luogo class="form-label">Luogo di ritiro</label>
                    <input type="text" class="form-control" id="luogo" name="luogo" required>
                </div>
                <div class="col-mb-3">
                    <label for luogo class="form-label">Luogo di riconsegna</label>
                    <input type="text" class="form-control" id="luogo" name="luogo" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label for="note" class="form-label">Note</label>
                    <textarea class="form-control" id="note" name="note" rows="3"></textarea>
                </div>
                
            </div>

            <div class="row mb-3">
                   <button type="submit" class="btn btn-primary">Prenota</button> 
                
                
            </div>
            
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
